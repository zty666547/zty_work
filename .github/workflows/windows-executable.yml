name: Build Windows executable

on:
  workflow_dispatch:
  push:
    tags:
      - "windows-v*"

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install runtime and builder
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.16.0

      - name: Build single executable
        run: pyinstaller --noconfirm --clean packaging/debugpath_windows.spec

      - name: Smoke-test executable
        shell: pwsh
        run: |
          $env:DEBUGPATH_PORT = "8501"
          $process = Start-Process -FilePath "dist\DebugPath.exe" -PassThru
          try {
            $ready = $false
            foreach ($attempt in 1..45) {
              Start-Sleep -Seconds 2
              try {
                $response = Invoke-WebRequest "http://127.0.0.1:8501/_stcore/health" -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200) {
                  $ready = $true
                  break
                }
              } catch {
                Write-Host "Waiting for DebugPath ($attempt/45)..."
              }
            }
            if (-not $ready) { throw "DebugPath executable did not become healthy." }
          } finally {
            taskkill /PID $process.Id /T /F 2>$null
          }

      - name: Create checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash "dist\DebugPath.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  DebugPath.exe" | Set-Content "dist\DebugPath.exe.sha256" -Encoding ascii

      - name: Upload tested artifact
        uses: actions/upload-artifact@v4
        with:
          name: DebugPath-Windows
          path: |
            dist/DebugPath.exe
            dist/DebugPath.exe.sha256
          if-no-files-found: error

      - name: Publish tagged build
        if: startsWith(github.ref, 'refs/tags/windows-v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            "dist\DebugPath.exe" `
            "dist\DebugPath.exe.sha256" `
            --title "DebugPath Windows 便携版" `
            --notes "下载 DebugPath.exe 后双击运行，程序会自动打开浏览器。该版本内置知识图谱并使用离线模式，不需要安装 Python、Neo4j 或配置 API 密钥。"
